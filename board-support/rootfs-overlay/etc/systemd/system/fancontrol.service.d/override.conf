[Service]
# Run our config-updater first, then the upstream --check, then ExecStart.
# Empty assignment clears the inherited ExecStartPre list.
ExecStartPre=
ExecStartPre=/usr/local/bin/fancontrol-update-config
ExecStartPre=/usr/sbin/fancontrol --check
# Allow writing /etc/fancontrol (upstream uses ProtectSystem=strict)
ReadWritePaths=/etc/fancontrol
