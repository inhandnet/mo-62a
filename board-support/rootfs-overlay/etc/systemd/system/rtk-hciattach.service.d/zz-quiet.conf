# Silence the rtk_hciattach H5 handshake trace on the serial console.
# rtk_hciattach prints a per-packet H5 sync log ("We request packet no N",
# "Sending packet with seqno N", "hu ... count ... rx_state ...", "Removing N
# pkts ...") to stdout, which floods the boot console (ttyS2). Discard stdout so
# it never reaches the journal/console; keep stderr -> journal for real errors.
[Service]
StandardOutput=null
