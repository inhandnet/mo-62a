# app_edgeai example config — USB camera object detection on HDMI.
# A USB UVC camera delivers BGR frames directly (no VPAC/subdev). Set `source`
# to your camera's node (see `edgeai-demo status`); /dev/video8 is typical.
# Run: sudo systemctl stop lightdm
#      sudo -E ./app_edgeai ../configs/object_detection_usb.yaml
title: "Object Detection (USB)"
log_level: 2
inputs:
    input0:
        source: /dev/video8
        width: 1280
        height: 720
        format: bgr
        framerate: 30
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.4
outputs:
    output0:
        sink: kmssink
        width: 1920
        height: 1080
        overlay-perf-type: graph
        main-title: ""
flows:
    flow0: [input0,model0,output0,[320,150,1280,720]]
