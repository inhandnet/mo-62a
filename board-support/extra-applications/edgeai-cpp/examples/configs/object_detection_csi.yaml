# app_edgeai example config — CSI camera (IMX219) object detection on HDMI.
# Run: sudo init-imx219 ; sudo systemctl stop lightdm
#      sudo -E ./app_edgeai ../configs/object_detection_csi.yaml
# Adjust source/subdev-id to match `edgeai-demo status` if they differ.
title: "Object Detection (CSI)"
log_level: 2
inputs:
    input0:
        source: /dev/video-imx219-cam0
        subdev-id: /dev/v4l-imx219-subdev0
        width: 1920
        height: 1080
        format: rggb
        framerate: 30
models:
    model0:
        model_path: /opt/model_zoo/ONR-OD-8200-yolox-nano-lite-mmdet-coco-416x416
        viz_threshold: 0.4
outputs:
    output0:
        sink: kmssink
        width: 1920
        height: 1080
        overlay-perf-type: graph
        main-title: ""
flows:
    flow0: [input0,model0,output0,[320,150,1280,720]]
