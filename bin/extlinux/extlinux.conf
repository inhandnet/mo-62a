menu title mo-62a MicroSD (extlinux.conf)

timeout 30

default microSD

# 40-pin GPIO mode (default): all expansion pins as plain GPIO
label microSD
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  # initrd /initrd.img

# 40-pin WKUP_I2C0 mode: Pins 3,5 as I2C bus
label microSD-i2c0
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-i2c0.dtbo
  # initrd /initrd.img

# 40-pin UART5 mode: Pins 8,10 as UART TXD/RXD
label microSD-uart5
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-uart5.dtbo
  # initrd /initrd.img

# 40-pin SPI0 mode: Pins 19,21,23,24,26 as SPI bus with two spidev CS
label microSD-spi0
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-spi0.dtbo
  # initrd /initrd.img

# 40-pin EHRPWM0 mode: Pins 32,33 as PWM outputs
label microSD-ehrpwm0
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-ehrpwm0.dtbo
  # initrd /initrd.img

# 40-pin Audio HAT mode: WM8960 codec via WKUP_I2C0 + MCASP2 I2S
# Pins 3,5: I2C control; Pins 12,35,38,40: I2S audio
label microSD-audio
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-audio.dtbo
  # initrd /initrd.img

# IMX219 CSI camera on CSI0 connector (no 40-pin special functions)
label microSD-cam
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-cam-imx219.dtbo
  # initrd /initrd.img

# 40-pin full peripheral mode: all special functions enabled simultaneously + IMX219 camera
label microSD-periph
  append console=ttyS2,115200n8 earlycon=ns16550a,mmio32,0x02800000 root=/dev/mmcblk1p3 rw rootfstype=ext4 rootwait
  kernel /Image
  fdt    /ti/k3-am62a7-mo-62a.dtb
  fdtoverlays /ti/k3-am62a7-mo-62a-exp-periph.dtbo /ti/k3-am62a7-mo-62a-cam-imx219.dtbo
  # initrd /initrd.img
