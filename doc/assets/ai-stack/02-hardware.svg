<text x="73" y="682" font-family="Noto Sans CJK SC, DejaVu Sans, sans-serif" font-size="13" fill="#a93226" text-anchor="start" font-weight="700" opacity="1.0">AM62A 没有独立 NPU —— 所谓 2 TOPS 就是 C7x + MMA。也没有 RGA（那是瑞芯微的部件）。VPU 只做视频编解码，不能加速推理。</text>
